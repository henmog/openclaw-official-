services:
  - type: web
    name: openclaw
    runtime: docker
    plan: starter
    healthCheckPath: /startupz
    dockerCommand: /usr/local/bin/start-openclaw.sh
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    plan: free
